services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futsal_next_app
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      # Force production mode regardless of what .env sets
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@arena-db:5432/futsal_laravel?schema=public
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-superadmin@example.com}
      - ADMIN_MOBILE=${ADMIN_MOBILE:-+919999999999}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123456}
      # AiSensy WhatsApp provider
      - AISENSY_API_KEY=${AISENSY_API_KEY}
      - AISENSY_USERNAME=${AISENSY_USERNAME:-AITD Official}
      - AISENSY_CAMPAIGN_NAME_OTP=${AISENSY_CAMPAIGN_NAME_OTP:-agnel_arena_otp}
      - AISENSY_CAMPAIGN_NAME_BOOKING=${AISENSY_CAMPAIGN_NAME_BOOKING:-agnelarena_cofirm}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: futsal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: futsal_laravel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - arena-db
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d futsal_laravel"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
